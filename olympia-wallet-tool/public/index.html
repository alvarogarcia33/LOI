<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Olympia Wallet Tool</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <h1>Olympia Wallet Tool</h1>
          <p id="meta">Cargando base local...</p>
        </div>
        <a class="download" href="/download/team.csv">Descargar CSV</a>
      </header>

      <section class="toolbar">
        <button id="openOlympia" type="button">Abrir Olympia</button>
        <button id="sync" type="button">Extraer datos</button>
        <div class="status" id="status">Listo</div>
      </section>

      <section class="lookup">
        <form id="searchForm" class="search">
          <div>
            <label for="wallet">Wallet</label>
            <input id="wallet" name="wallet" autocomplete="off" spellcheck="false" autofocus>
          </div>
          <button type="submit">Buscar</button>
        </form>
        <div id="result" class="result">
          <div class="empty">Pegá una dirección de cartera.</div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
